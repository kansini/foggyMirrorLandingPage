<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme, language;
        try {
          theme = localStorage.getItem('foggy-mirror-theme');
          language = localStorage.getItem('foggy-mirror-language');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/appicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf1e9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="哈一口气，画一点心情。雾镜把起雾玻璃上的小快乐，装进你的 iPhone。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="雾镜 · 呼——雾里见。" />
    <meta property="og:description" content="哈一口气，画一点心情。雾镜把起雾玻璃上的小快乐，装进你的 iPhone。" />
    <title>雾镜 · 呼——雾里见。</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
